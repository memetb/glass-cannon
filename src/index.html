<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>%TITLE%</title>
  <meta name="description" content="%DESCRIPTION%" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23fb923c'/><stop offset='1' stop-color='%239333ea'/></linearGradient></defs><polygon points='50,5 95,50 50,95 5,50' fill='url(%23g)'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="vendor/vue.global.prod.js"></script>
  <script id="content" type="application/json">%CONTENT_JSON%</script>

</head>

<body class="grain font-sans text-white antialiased selection:bg-violet/60 overflow-x-hidden">
  <div id="app" v-cloak>
    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
      <div class="blob w-[55vw] h-[55vw] -top-[15vw] -left-[10vw] bg-ember"></div>
      <div class="blob w-[60vw] h-[60vw] top-[30vh] -right-[20vw] bg-violet" style="animation-delay:-9s"></div>
      <div class="blob w-[40vw] h-[40vw] bottom-[-10vw] left-[20vw] bg-fuchsia-600" style="animation-delay:-17s"></div>
      <div class="absolute inset-0"
           :style="{ background: `radial-gradient(600px circle at ${mx}px ${my}px, rgba(255,140,40,.12), transparent 60%)` }"></div>
      <div class="absolute inset-0 bg-[linear-gradient(to_right,rgba(255,255,255,.04)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,.04)_1px,transparent_1px)] bg-[size:64px_64px] [mask-image:radial-gradient(ellipse_at_center,#000_30%,transparent_75%)]"></div>
    </div>

    <!-- Scroll progress -->
    <div class="fixed top-0 left-0 right-0 h-[3px] z-50 bg-white/5">
      <div class="h-full bg-gradient-to-r from-amber via-ember to-violet shadow-[0_0_12px_#ff7a18]"
           :style="{ width: (progress * 100) + '%' }"></div>
    </div>

    <!-- Repo link -->
    <a v-if="site.repo" :href="site.repo" target="_blank" rel="noopener noreferrer"
       class="glass fixed top-4 right-4 md:top-6 md:right-8 z-50 flex items-center gap-2 rounded-full px-4 py-2 font-mono text-xs uppercase tracking-[.25em] text-white/80 hover:text-white hover:shadow-[0_0_24px_rgba(255,122,24,.5)] transition"
       aria-label="View source on GitHub">
      <svg class="w-4 h-4" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span class="hidden sm:inline">GitHub</span>
    </a>

    <!-- Dot nav -->
    <nav class="fixed right-4 md:right-8 top-1/2 -translate-y-1/2 z-40 hidden sm:flex flex-col gap-4" aria-label="Sections">
      <a v-for="(s, i) in sections" :key="s.id" :href="'#' + s.id"
         class="group flex items-center justify-end gap-3" :aria-label="s.label">
        <span class="font-mono text-[10px] uppercase tracking-[.3em] text-white/0 group-hover:text-white/70 transition">{{ s.label }}</span>
        <span class="block rounded-full transition-all duration-500"
              :class="active === i ? 'w-3 h-3 bg-gradient-to-br from-amber to-violet shadow-[0_0_14px_#ff7a18]' : 'w-2 h-2 bg-white/30 group-hover:bg-white/60'"></span>
      </a>
    </nav>

    <!-- Hero -->
    <header id="hero" data-section class="relative min-h-[100svh] flex flex-col items-center justify-center px-4 text-center">
      <p v-if="site.eyebrow" class="font-mono text-xs uppercase tracking-[.5em] text-amber/80 mb-8">{{ site.eyebrow }}</p>
      <h1 class="max-w-6xl text-5xl sm:text-7xl md:text-8xl font-bold leading-[.95] tracking-tight"
          :style="{ transform: `translateY(${scrollY * 0.25}px)`, opacity: Math.max(0, 1 - scrollY / 700) }">
        <span class="sheen">{{ site.title }}</span>
        <span v-if="site.headline" class="block mt-6 text-2xl sm:text-4xl md:text-5xl font-semibold text-white/90 leading-tight" v-html="site.headline"></span>
      </h1>
      <p v-if="site.byline" class="byline mt-10 font-serif italic text-xl sm:text-3xl text-white/70"
         :style="{ opacity: Math.max(0, 1 - scrollY / 500) }" v-html="site.byline"></p>
      <a v-if="cards.length" :href="'#' + cards[0].id" class="absolute bottom-10 flex flex-col items-center gap-2 text-white/50 hover:text-white transition">
        <span class="font-mono text-[10px] uppercase tracking-[.4em]">Descend</span>
        <svg class="bob w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </a>
    </header>

    <!-- Narrative cards -->
    <main class="relative">
      <section v-for="(c, i) in cards" :key="c.id" :id="c.id" data-section
               class="min-h-[100svh] flex flex-col xl:flex-row items-center gap-12 xl:gap-8 px-4 sm:px-8 py-24 xl:py-0 [perspective:1400px]"
               :class="c.quote ? 'justify-center xl:justify-between' : (i % 2 ? 'justify-end' : 'justify-start')">
        <article :ref="el => cardEls[i] = el"
                 class="reveal glass w-full rounded-[2rem] p-8 sm:p-12 shadow-[0_30px_120px_-20px_rgba(139,44,245,.45)] md:mx-[6vw]"
                 :class="[{ 'is-in': revealed[i] }, c.quote ? 'max-w-xl' : 'max-w-2xl']"
                 @mousemove="tilt($event, i)" @mouseleave="tilts[i] = ''"
                 :style="{ transform: revealed[i] ? tilts[i] : undefined }">
          <div class="flex items-baseline justify-between mb-8">
            <span class="font-mono text-xs tracking-[.35em] uppercase text-amber/90">{{ c.kicker }}</span>
            <span class="font-serif italic text-7xl sm:text-8xl leading-none text-transparent bg-clip-text bg-gradient-to-b from-white/40 to-white/0 select-none">{{ String(i + 1).padStart(2, '0') }}</span>
          </div>
          <h2 class="text-3xl sm:text-5xl font-bold leading-tight mb-6">
            <span class="bg-gradient-to-r from-amber via-ember to-fuchsia-500 bg-clip-text text-transparent" v-html="c.title"></span>
          </h2>
          <div class="card-body" v-html="c.body"></div>
          <div v-if="c.tags.length" class="mt-8 flex flex-wrap gap-2">
            <span v-for="t in c.tags" :key="t"
                  class="font-mono text-[11px] uppercase tracking-widest px-3 py-1 rounded-full bg-white/5 ring-1 ring-white/15 text-white/70">{{ t }}</span>
          </div>
        </article>
        <blockquote v-if="c.quote"
           class="reveal relative flex-1 max-w-2xl font-quote font-light text-white text-3xl sm:text-4xl xl:text-3xl 2xl:text-4xl leading-[1.25] tracking-[-0.01em] xl:ml-[2vw] xl:mr-[4vw] sm:pr-10"
           :class="[{ 'is-in': revealed[i] }, i % 2 ? 'xl:order-first xl:text-left' : 'xl:text-right']"
           style="transition-delay:.3s">
          <span aria-hidden="true" class="block font-quote text-[1.6em] leading-[.5] text-white/30 mb-2">&ldquo;</span>
          <span v-html="c.quote"></span>
        </blockquote>
      </section>
    </main>

    <footer id="end" data-section class="min-h-[60svh] flex flex-col items-center justify-center px-4 text-center gap-6">
      <p v-if="site.footer" class="font-serif italic text-4xl sm:text-6xl sheen" v-html="site.footer"></p>
      <p class="font-mono text-xs uppercase tracking-[.4em] text-white/40">© {{ year }} {{ site.title }}</p>
    </footer>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted, onBeforeUnmount } = Vue;

    const site = JSON.parse(document.getElementById("content").textContent);

    createApp({
      setup() {
        const cards = site.cards;
        const sections = [{ id: "hero", label: "Intro" }, ...cards.map(c => ({ id: c.id, label: c.kicker || c.id })), { id: "end", label: "End" }];

        const cardEls = [];
        const revealed = reactive(cards.map(() => false));
        const tilts = reactive(cards.map(() => ""));
        const scrollY = ref(0), progress = ref(0), active = ref(0), mx = ref(-999), my = ref(-999);
        const year = new Date().getFullYear();
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

        let raf = 0, scrollY_ = 0;
        const onScroll = () => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = 0;
            scrollY.value = scrollY_ = window.scrollY;
            const max = document.documentElement.scrollHeight - innerHeight;
            progress.value = max > 0 ? scrollY_ / max : 0;
          });
        };
        const onMove = e => { mx.value = e.clientX; my.value = e.clientY; };

        const tilt = (e, i) => {
          if (reduced || !matchMedia("(hover: hover)").matches) return;
          const r = e.currentTarget.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
          tilts[i] = `rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
        };

        let revealObs, sectionObs;
        onMounted(() => {
          revealObs = new IntersectionObserver(entries => {
            for (const en of entries) {
              const i = cardEls.indexOf(en.target);
              if (i >= 0 && en.isIntersecting) { revealed[i] = true; revealObs.unobserve(en.target); }
            }
          }, { threshold: 0.25, rootMargin: "0px 0px -10% 0px" });
          cardEls.forEach(el => el && revealObs.observe(el));

          const secEls = [...document.querySelectorAll("[data-section]")];
          sectionObs = new IntersectionObserver(entries => {
            for (const en of entries) if (en.isIntersecting) active.value = secEls.indexOf(en.target);
          }, { rootMargin: "-50% 0px -50% 0px" });
          secEls.forEach(el => sectionObs.observe(el));

          addEventListener("scroll", onScroll, { passive: true });
          addEventListener("pointermove", onMove, { passive: true });
          onScroll();
        });
        onBeforeUnmount(() => {
          revealObs?.disconnect(); sectionObs?.disconnect();
          removeEventListener("scroll", onScroll); removeEventListener("pointermove", onMove);
        });

        return { site, cards, sections, cardEls, revealed, tilts, tilt, scrollY, progress, active, mx, my, year };
      },
    }).mount("#app");
  </script>
</body>
</html>
